[project]
name = "yt2-worker"
version = "0.1.0"
description = "Worker local YouTube 2.0 : agents, génération vidéo/TTS, montage, upload, synchro Analytics"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "apscheduler>=3.10,<4",
  "google-api-python-client>=2.140",
  "google-auth>=2.30",
  "anthropic>=0.40",
  "cryptography>=43",
  "structlog>=24",
  "pillow>=10",  # titre d'accroche gravé (worker/hooktitle.py, repris de MJClipIt)
  "numpy>=1.26",  # scène carte (worker/maps.py), calage des voix (worker/lipsync.py), montage (worker/timeline.py)
]

[project.optional-dependencies]
tts = ["kokoro-onnx>=0.4", "soundfile>=0.12"]
web = ["playwright>=1.55"]  # clips par l'appli Gemini, Chrome piloté (docs/17) ; pas de navigateur à télécharger
dev = ["ruff>=0.6", "pytest>=8"]

[project.scripts]
worker = "worker.main:main"
yt2 = "worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # longueur gérée par le formateur ; les chaînes SQL restent longues
