# Rejouée à chaque push sur main (dépôt public youtube-aura-farming-2) ; règles pour la garder verte : CLAUDE.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/dashboard }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        # même Node que le PC de Luca et que l'installeur (LTS 24)
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/dashboard/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env: { NEXT_PUBLIC_MOCK: "1" }

  worker:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: services/worker }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      # mêmes extras que l'installeur (tts, web) ; --locked : échoue si uv.lock ne suit pas pyproject.toml
      # (l'installeur installe le lock tel quel, --frozen)
      - run: uv sync --locked --extra dev --extra tts --extra web
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
